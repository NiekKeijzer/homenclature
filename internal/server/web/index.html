<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Home</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header class="hero">
      <p class="clock" aria-hidden="true"></p>
      <h1 class="greeting" data-name="{{.Name}}">Hello{{with .Name}}, {{.}}{{end}}</h1>
    </header>

    {{if .Sections}}
    <label class="search glass">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" placeholder="Search your links" aria-label="Search your links" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </label>
    {{end}}

    {{with .Sections}}
    <div class="sections">
    {{range .}}
    <section class="panel glass {{or .Layout "list"}}">
      <h2>{{.Title}}</h2>
      <div class="links">
        {{range .Links}}
        <a class="link" href="{{.URL}}">
          <span class="icon" aria-hidden="true">{{initial .Title}}{{with .Icon}}<img src="{{iconURL .}}" alt="" onerror="this.remove()">{{end}}</span>
          <span class="text">
            <span class="title">{{.Title}}</span>
            {{with .Description}}<span class="description">{{.}}</span>{{end}}
          </span>
        </a>
        {{end}}
      </div>
    </section>
    {{end}}
    </div>
    {{else}}
    <p class="empty glass">No links for you yet.</p>
    {{end}}
    <p class="empty glass no-matches" hidden>No matches.</p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
