[tools]
go = "1.27"
node = "26" # npm installs HTMX and the Sora font, see package.json
jq = "1.8.2" # used by .claude/hooks/go-check.sh
air = "1.67" # live reload for `mise run dev`

[env]
'_'.file = { path = ".env" }

[tasks.assets]
description = "Install HTMX and the Sora font from npm into internal/server/web/static/lib"
run = "npm ci && npm run assets"
# Skipped while lib is newer than these
sources = ["package.json", "package-lock.json"]
outputs = ["internal/server/web/static/lib/*"]

[tasks.dev]
description = "Run the app with live reload at http://localhost:8000 (start `mise run oidc` first)"
depends = ["assets"]
run = "air -c dev/air.toml"

[tasks.dev.env]
HOMENCLATURE_CONFIG = "{{ env.HOMENCLATURE_CONFIG | default(value='config.example.toml') }}"
HOMENCLATURE_URL = "http://localhost:8000" # air's proxy, see dev/air.toml
HOMENCLATURE_LISTEN = ":8001"
HOMENCLATURE_OIDC_ISSUER = "http://localhost:8080/default"
HOMENCLATURE_OIDC_CLIENT_ID = "homenclature"
HOMENCLATURE_OIDC_CLIENT_SECRET = "dev"
HOMENCLATURE_SESSION_SECRET = "dev-only-session-secret-not-for-production"
HOMENCLATURE_BACKGROUND="landscape"
# Search tokens for config.example.toml: your own if set in .env or exported, else "dev"
# (the example's apps don't exist, so their searches fail: logged, not shown).
# Task env beats [env] and the shell, so read them via env (get_env misses .env).
HOMENCLATURE_HOME_ASSISTANT_TOKEN = "{{ env.HOMENCLATURE_HOME_ASSISTANT_TOKEN | default(value='dev') }}"
HOMENCLATURE_IMMICH_TOKEN = "{{ env.HOMENCLATURE_IMMICH_TOKEN | default(value='dev') }}"
HOMENCLATURE_JELLYFIN_TOKEN = "{{ env.HOMENCLATURE_JELLYFIN_TOKEN | default(value='dev') }}"
HOMENCLATURE_MEALIE_TOKEN = "{{ env.HOMENCLATURE_MEALIE_TOKEN | default(value='dev') }}"
HOMENCLATURE_PAPERLESS_TOKEN = "{{ env.HOMENCLATURE_PAPERLESS_TOKEN | default(value='dev') }}"
HOMENCLATURE_SEERR_TOKEN = "{{ env.HOMENCLATURE_SEERR_TOKEN | default(value='dev') }}"
# The example's Immich URL comes from an env var too (url_env).
HOMENCLATURE_IMMICH_URL = "{{ env.HOMENCLATURE_IMMICH_URL | default(value='https://photos.home.example') }}"

[tasks.oidc]
description = "Start mock OIDC at http://localhost:8080/default"
run = "docker compose up -d oidc"

[tasks."oidc:down"]
description = "Stop mock OIDC"
run = "docker compose down"

[tasks.test]
description = "Run tests"
depends = ["assets"]
run = "go test ./..."

[tasks.lint]
description = "Check gofmt and run go vet"
depends = ["assets"] # go vet compiles the embedded files
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
go vet ./...
'''

[tasks.check]
description = "Lint + test (run before calling work done)"
depends = ["lint", "test"]

[tasks.docker]
description = "Build the Docker image locally"
run = "docker build -t homenclature:dev ."
