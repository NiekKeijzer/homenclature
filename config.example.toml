# Homenclature dashboard config.
#
# Each table under [dashboards] is the dashboard for one OIDC group, keyed by
# the group name (exact match).
#
# Users who match no group dashboard see the dashboard named by the
# HOMENCLATURE_DEFAULT_DASHBOARD env var (e.g. "family"), or nothing if it's
# unset. If it names a dashboard that doesn't exist, the app won't start.
#
# A user in several groups gets one merged page:
#   - dashboards are combined in the order they appear in this file
#   - sections with the same title become one section
#   - within a section, links with the same url are shown once
#
# Fields
#   section: title (required), layout, links
#            layout: "list" (default; rows with descriptions) or "cards" (big cards);
#            on wide screens, neighbouring list sections sit side by side;
#            when sections merge, the first layout set wins
#   link:    title (required), url (required, absolute), icon, description, search
#
# icon: a name from https://github.com/homarr-labs/dashboard-icons (e.g. "jellyfin")
#       or a full URL. The server fetches and caches icons.
#
# search: opt in to searching inside the app from the search box. Results
#   link straight to the item in the app. Nothing in the app is changed.
#     type      (required) home-assistant, immich, jellyfin, mealie, paperless
#               or seerr (films and shows not in your library yet, to request)
#     token_env (required) name of the env var holding the API token;
#               the app won't start if it's unset
#     api_url   where the server reaches the API, if not at url
#               (e.g. "http://jellyfin:8096")
#     limit     results shown, 1 to 50 (default 5; Immich 8)
#   Per app:
#     jellyfin        types: item types to search (default Movie, Series,
#                       Episode, MusicAlbum, Audio; also AudioBook, Book, BoxSet,
#                       MusicArtist, MusicVideo, Playlist, Season, Video)
#                     seerr_url: offer "Request it in Seerr" to people who
#                       can't search Seerr (no Seerr link with search)
#     home-assistant  domains: entity domains to search (default all),
#                       e.g. ["light", "switch", "sensor"]
#
#   Searches run with that token, so results show what the token can see.
#   Anyone who sees the link can search the app. For a restricted search per
#   group (e.g. kids), put the link in each group's dashboard with its own
#   token_env, not in a shared one: merged links keep the first in file order.
#
#   Tokens:
#     home-assistant  Profile > Security > Long-lived access tokens. Tokens
#                     can't be read-only: make a non-admin user for this.
#     immich          Account settings > API keys (asset.read and asset.view)
#     jellyfin        Dashboard > API keys (searches everything), or a user's
#                     access token (searches what that user may see)
#     mealie          Profile > API tokens
#     paperless       My Profile > API auth token
#     seerr           Settings > General > API Key. It's an admin key, but it's
#                     only used to search: results open in Seerr, where people
#                     request as themselves.

# Everyone in the household.
[[dashboards.family.sections]]
title = "Media"
layout = "cards"

[[dashboards.family.sections.links]]
title = "Jellyfin"
url = "https://jellyfin.home.example"
icon = "jellyfin"
description = "Movies and shows"
search = { type = "jellyfin", token_env = "HOMENCLATURE_JELLYFIN_TOKEN", seerr_url = "https://seer.home.example" }

[[dashboards.family.sections.links]]
title = "Seerr"
url = "https://seer.home.example"
icon = "seerr"
description = "Request a new movie"
search = { type = "seerr", token_env = "HOMENCLATURE_SEERR_TOKEN" }

[[dashboards.family.sections.links]]
title = "Immich"
url = "https://photos.home.example"
icon = "immich"
description = "Photos"
search = { type = "immich", token_env = "HOMENCLATURE_IMMICH_TOKEN" }

[[dashboards.family.sections]]
title = "Home"

[[dashboards.family.sections.links]]
title = "Home Assistant"
url = "https://ha.home.example"
icon = "home-assistant"
description = "Lights, heating and more"
search = { type = "home-assistant", token_env = "HOMENCLATURE_HOME_ASSISTANT_TOKEN", domains = ["light", "switch", "sensor", "binary_sensor", "climate"] }

[[dashboards.family.sections.links]]
title = "Mealie"
url = "https://recipes.home.example"
icon = "mealie"
description = "Recipes and meal plans"
search = { type = "mealie", token_env = "HOMENCLATURE_MEALIE_TOKEN" }

[[dashboards.kids.sections]]
title = "Media"

[[dashboards.kids.sections.links]]
title = "Audiobookshelf"
url = "https://books.home.example"
icon = "audiobookshelf"
description = "Audiobooks"

[[dashboards.parents.sections]]
title = "Home" # merged with the family "Home" section; Admin sits beside it

[[dashboards.parents.sections.links]]
title = "Paperless"
url = "https://docs.home.example"
icon = "paperless-ngx"
description = "Documents"
search = { type = "paperless", token_env = "HOMENCLATURE_PAPERLESS_TOKEN" }

[[dashboards.parents.sections]]
title = "Admin"

[[dashboards.parents.sections.links]]
title = "Proxmox"
url = "https://pve.home.example"
icon = "proxmox"

[[dashboards.parents.sections.links]]
title = "Authentik"
url = "https://auth.home.example"
icon = "authentik"
